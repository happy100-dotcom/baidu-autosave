version: '3'

services:
  baidu-autosave:
    image: kokojacket/baidu-autosave:latest
    container_name: baidu-autosave
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./log:/app/log
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required — generate with: python3 -c "import secrets; print(secrets.token_hex(32))"}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
